# Spectral lint ruleset for the WEX OpenAPI baseline (Chunk C3 §S2).
#
# Extends the spectral-built-in OAS ruleset and adds project-specific rules:
# - every operation has an operationId
# - every operation has a description
# - every operation is tagged
# - every error response uses the application/problem+json content-type
# - no PII-shaped field names in schemas
extends:
  - "spectral:oas"

rules:
  # Operation-level basics (from spectral:oas, made explicit + raised to error)
  operation-operationId:
    severity: error
  operation-description:
    severity: error
  operation-tag-defined:
    severity: error

  # RFC 9457 conformance — every 4xx/5xx must use application/problem+json
  wex-error-responses-must-use-problem-json:
    description: All 4xx and 5xx responses must declare application/problem+json content.
    severity: error
    given: "$.paths[*][*].responses[?(@property.match(/^[45][0-9][0-9]$/))]"
    then:
      field: "content.application/problem+json"
      function: truthy

  # PII-shape rejection — no raw `pan`, `cvv`, `track`, `password` field names anywhere
  wex-no-pii-field-names:
    description: Schema field names matching PII patterns are forbidden in the OAS.
    severity: error
    given: "$..properties.*~"
    then:
      function: pattern
      functionOptions:
        notMatch: "(?i)^(pan|cvv|track[12]?|password|secret|ssn|cardnumber)$"

  # ProblemDetail must define an errorCode enum so clients can pattern-match
  wex-problem-detail-enumerates-error-codes:
    description: The ProblemDetail schema must enumerate WEX errorCode values.
    severity: error
    given: "$.components.schemas.ProblemDetail.properties.errorCode"
    then:
      field: enum
      function: truthy
