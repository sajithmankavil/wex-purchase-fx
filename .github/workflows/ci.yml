name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python if present
        if: hashFiles('pyproject.toml', 'requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node if present
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Install Python deps
        if: hashFiles('requirements.txt') != ''
        run: pip install -r requirements.txt

      - name: Docs check
        run: make docs-check

      - name: Operational readiness check
        run: make ops-check

      - name: PCI Tier 1 readiness gate
        run: make pci-check

      - name: Lint
        run: make lint

      - name: Typecheck
        run: make typecheck

      - name: Tests
        run: make test
