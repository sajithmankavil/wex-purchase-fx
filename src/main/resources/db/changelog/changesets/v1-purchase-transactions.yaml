databaseChangeLog:
  - changeSet:
      id: v1-create-purchase-transactions
      author: wex-purchase-fx
      labels: schema,phase-13,chunk-b1
      comment: >
        FR-001 + FR-002 — purchase storage. UUID v7 PK, scale-2 amount,
        bounded description (≤50 chars). Per data-model.md §3. Rollback class C.
      changes:
        - createTable:
            tableName: purchase_transactions
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_purchase_transactions
              - column:
                  name: description
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: transaction_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: amount_usd
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP(6)
                  constraints:
                    nullable: false
        - sql:
            comment: CHECK constraints (data-model.md §3)
            sql: >
              ALTER TABLE purchase_transactions
              ADD CONSTRAINT chk_amount_positive CHECK (amount_usd > 0);
              ALTER TABLE purchase_transactions
              ADD CONSTRAINT chk_description_length CHECK (CHAR_LENGTH(description) <= 50);
              ALTER TABLE purchase_transactions
              ADD CONSTRAINT chk_description_not_blank CHECK (CHAR_LENGTH(TRIM(description)) > 0);
      rollback:
        - dropTable:
            tableName: purchase_transactions
