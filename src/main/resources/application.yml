# WEX Purchase Currency Conversion Service — application configuration.
#
# DataSource is bound from WEX_DB_* env vars per deployment-architecture.md §4.3.
# No URLs are committed; the prod profile is fully env-driven. Local default is
# H2 in file mode at ${WEX_DATA_DIR}/wex.mv.db.

spring:
  application:
    name: wex-purchase-fx
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: ${WEX_LIQUIBASE_CONTEXTS:}
  datasource:
    url: ${WEX_DB_URL:jdbc:h2:file:${WEX_DATA_DIR:./.wex-data}/wex;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}
    username: ${WEX_DB_USERNAME:sa}
    password: ${WEX_DB_PASSWORD:}
    hikari:
      pool-name: wex-pool
      maximum-pool-size: ${WEX_DB_POOL_MAX:20}
      minimum-idle: ${WEX_DB_POOL_MIN:5}
      connection-timeout: 5000
      validation-timeout: 3000

# Graceful shutdown — 60s drain per deployment-architecture.md §5
server:
  shutdown: graceful
  port: ${WEX_HTTP_PORT:8080}

# Hot-cache + readiness signal config exposed as @ConfigurationProperties("wex")
wex:
  cache:
    exchange-rate:
      maximum-size: ${WEX_CACHE_MAX_SIZE:2000}
      expire-after-write-hours: ${WEX_CACHE_TTL_HOURS:24}
  alias:
    resource: classpath:currency-aliases.json
  readiness:
    db-pool-headroom:
      # Readiness flips DOWN when active >= max-1 sustained for this many ms
      # (G6-P0-4 / G4-P1-19; readiness check is consulted by the actuator probe)
      sustained-saturation-ms: ${WEX_READINESS_DB_POOL_SUSTAINED_MS:5000}
  treasury:
    # Treasury Fiscal Data API — ADR-0001 D-9. User-Agent set per Treasury best practice (G-P2-5).
    base-url: ${WEX_TREASURY_BASE_URL:https://api.fiscaldata.treasury.gov}
    rates-path: ${WEX_TREASURY_RATES_PATH:/services/api/fiscal_service/v1/accounting/od/rates_of_exchange}
    user-agent: ${WEX_TREASURY_USER_AGENT:wex-purchase-fx/0.1.0 (contact:ops@example.com)}
  single-flight:
    # D-9 loser semantics: 10 s wait + 100 ms DB poll + WinnerOutcome ref mirror.
    loser-wait-ms: ${WEX_SF_LOSER_WAIT_MS:10000}
    db-poll-interval-ms: ${WEX_SF_DB_POLL_INTERVAL_MS:100}
  eligibility:
    # In-memory reference-data cache refresh period (eligibility-endpoint-spec.md §4.1).
    # Small, mostly-static table — 5 min default balances freshness against needless reload work.
    refresh-interval-ms: ${WEX_ELIGIBILITY_REFRESH_MS:300000}

# Resilience4j — ADR-0001 D-9; failure-modes-and-resilience.md §3
resilience4j:
  circuitbreaker:
    instances:
      treasuryClient:
        sliding-window-type: TIME_BASED
        sliding-window-size: 300                  # 300-second window (G6-P0-1)
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 300000       # 5 min before half-open
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  retry:
    instances:
      treasuryClient:
        max-attempts: 3
        wait-duration: 100
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
  bulkhead:
    instances:
      treasuryClient:
        max-concurrent-calls: 10
        max-wait-duration: 1s
  timelimiter:
    instances:
      treasuryClient:
        timeout-duration: 2s
        cancel-running-future: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,liveness,readiness
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          # Spring Boot's implicit "readiness" group defaults to ONLY readinessState —
          # a custom HealthIndicator is NOT auto-included just by existing as a bean.
          # Without this, DbPoolHeadroomHealthIndicator, GatewayRequiredHealthIndicator,
          # and BenefitEligibilityHealthIndicator are all invisible to
          # /actuator/health/readiness regardless of what they report (a pre-existing
          # gap for the first two, caught and fixed here alongside the new one).
          include: readinessState,dbPoolHeadroom,gatewayRequired,benefitEligibility
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    db:
      enabled: true

logging:
  level:
    com.example.purchaseconversion: INFO
    org.springframework: INFO
    liquibase: WARN
